definitions:
  lesson:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      title:
        type: string
      description:
        type: string
      content:
        type: string
      attachments:
        type: array
        items:
          type: string
      category:
        $ref: '#/definitions/lessonCategory'
      resourceType:
        $ref: '#/definitions/resourceType'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  lessons:
    type: object
    properties:
      count:
        type: number
      items:
        $ref: '#/definitions/lesson'
  lessonCategory:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
  postLessonBody:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 100
      description:
        type: string
        minLength: 1
        maxLength: 1000
      content:
        type: string
        minLength: 50
      attachments:
        type: array
        items:
          $ref: '#/definitions/attachmentInPostLesson'
      category:
        type: string
    required:
      - title
      - description
      - content
  attachmentInPostLesson:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      fileName:
        type: string
      link:
        type: string
      category:
        $ref: '#/definitions/lessonCategory'
      resourceType:
        $ref: '#/definitions/resourceType'
      size:
        type: number
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  lessonById:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      title:
        type: string
        minLength: 1
        maxLength: 100
      description:
        type: string
        minLength: 1
        maxLength: 1000
      content:
        type: string
        minLength: 50
      attachments:
        type: array
        items:
          $ref: '#/definitions/attachmentInLessonById'
      category:
        type: string
      resourceType:
        $ref: '#/definitions/resourceType'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  attachmentInLessonById:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      fileName:
        type: string
      link:
        type: string
      category:
        type: string
      resourceType:
        $ref: '#/definitions/resourceType'
      size:
        type: number
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  updateLessonRequest:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 100
