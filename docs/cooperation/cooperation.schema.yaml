definitions:
  cooperations:
    type: array
    items:
      type: object
      properties:
        _id:
          type: string
        proficiencyLevel:
          type: array
          $ref: '#/definitions/proficiencyLevelEnum'
          items:
            type: string
        subject:
          type: object
          properties:
            name:
              type: string
        category:
          type: object
          properties:
            appearance:
              type: object
              properties:
                color:
                  type: string
                icon:
                  type: string
        user:
          type: object
          $ref: '#/definitions/userInCooperations'
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            photo:
              type: string
            role:
              type: string
        description:
          type: string
        languages:
          type: array
          items:
            type: string
        offer:
          type: string
        initiator:
          type: string
        initiatorRole:
          $ref: '#/definitions/baseUserRoleEnum'
        receiver:
          type: string
        receiverRole:
          $ref: '#/definitions/baseUserRoleEnum'
        title:
          type: string
        additionalInfo:
          type: string
        price:
          type: number
        status:
          $ref: '#/definitions/cooperationStatusEnum'
        needAction:
          $ref: '#/definitions/baseUserRoleEnum'
        availableQuizzes:
          type: array
          items:
            type: string
        finishedQuizzes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  cooperation:
    type: object
    properties:
      _id:
        type: string
      offer:
        type: string
        ref: '#components/offer'
      initiator:
        type: string
        ref: '#/components/user'
      initiatorRole:
        type: string
      receiver:
        type: string
        ref: '#components/user'
      receiverRole:
        $ref: '#/definitions/baseUserRoleEnum'
      title:
        type: string
      status:
        type: string
        enum:
          - pending
          - active
          - declined
          - closed
      sections:
        type: array
        items:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            resources:
              type: array
              items:
                type: object
                properties:
                  resource:
                    type: object
                    additionalProperties: true
                  resourceType:
                    type: string
                    enum:
                      - lesson
                      - quiz
                      - attachment
                  availability:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - open
                          - closed
                          - openFrom
                        default: open
                      date:
                        type: string
                        format: date-time
                        default: null
      needAction:
        type: string
        enum:
          - student
          - tutor
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  cooperationResponse:
    type: object
    properties:
      _id:
        type: string
      offer:
        type: object
        properties:
          _id:
            type: string
          author:
            type: object
            properties:
              _id:
                type: string
              averageRating:
                type: object
                properties:
                  student:
                    type: number
                  tutor:
                    type: number
              firstName:
                type: string
              lastName:
                type: string
              photo:
                type: string
              professionalSummary:
                type: string
              totalReviews:
                type: object
                properties:
                  student:
                    type: number
                  tutor:
                    type: number
      initiator:
        type: string
      initiatorRole:
        type: string
      proficiencyLevel:
        type: array
        items:
          type: string
      subject:
        type: object
        properties:
          name:
            type: string
      category:
        type: object
        properties:
          appearance:
            type: object
            properties:
              color:
                type: string
              icon:
                type: string
      description:
        type: string
      languages:
        type: array
        items:
          type: string
      receiver:
        type: string
      receiverRole:
        type: string
      price:
        type: number
      title:
        type: string
      status:
        type: string
        enum:
          - pending
          - active
          - declined
          - closed
      sections:
        type: array
        items:
          type: object
          properties:
            title:
              type: string
            description:
              type: string
            resources:
              type: array
              items:
                type: object
                properties:
                  resource:
                    type: object
                    additionalProperties: true
                  resourceType:
                    type: string
                    enum:
                      - lesson
                      - quiz
                      - attachment
                  availability:
                    type: object
                    properties:
                      status:
                        type: string
                        enum:
                          - open
                          - closed
                          - openFrom
                        default: open
                      date:
                        type: string
                        format: date-time
                        default: null
      needAction:
        type: string
        enum:
          - student
          - tutor
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  cooperationBody:
    type: object
    properties:
      offer:
        type: string
      receiver:
        type: string
      receiverRole:
        $ref: '#/definitions/baseUserRoleEnum'
      price:
        type: number
      title:
        type: string
      additionalInfo:
        type: string
        minLength: 30
        maxLength: 1000
      proficiencyLevel:
        $ref: '#/definitions/proficiencyLevelEnum'
      sections:
        type: array
        items:
          $ref: '#/definitions/section'
    required:
      - title
      - offer
      - receiver
      - proficiencyLevel
      - receiverRole
      - price
  section:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      resources:
        type: array
        items:
          type: object
          properties:
            resource:
              type: object
              oneOf:
                - $ref: '#/definitions/cooperationLesson'
                - $ref: '#/definitions/cooperationQuiz'
                - $ref: '#/definitions/cooperationAttachment'
                - $ref: '#/definitions/question'
            resourceType:
              $ref: '#/definitions/resourceType'
            availability:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - closed
                    - openFrom
                  default: open
                date:
                  type: string
                  format: date-time
                  default: null
                  nullable: true
            completionStatus:
              $ref: '#/definitions/completionStatus'
  completionStatus:
    type: string
    enum:
      - completed
      - active
  cooperationStatusEnum:
    type: string
    enum:
      - pending
      - active
      - declined
      - closed
      - request to close
  resourceType:
    type: string
    enum:
      - lesson
      - quiz
      - attachment
      - question
  userInCooperations:
    type: object
    properties:
      _id:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      photo:
        type: string
      role:
        $ref: '#/definitions/baseUserRoleEnum'
  userInCooperationsExtended:
    type: object
    properties:
      _id:
        type: string
      role:
        type: array
        items:
          $ref: '#/definitions/baseUserRoleEnum'
      firstName:
        type: string
      lastName:
        type: string
      email:
        type: string
      mainSubjects:
        type: object
        properties:
          student:
            type: array
            items:
              $ref: '#/definitions/userMainSubjects'
          tutor:
            type: array
            items:
              $ref: '#/definitions/userMainSubjects'
      totalReviews:
        $ref: '#/definitions/userTotalReviews'
      averageRating:
        $ref: '#/definitions/userAverageRating'
      nativeLanguage:
        $ref: '#/definitions/userSpokenLanguagesEnum'
      lastLogin:
        type: string
        format: date-time
      status:
        $ref: '#/definitions/roleBasedStatus'
      professionalBlock:
        $ref: '#/definitions/userProfessionalBlock'
      notificationSettings:
        $ref: '#/definitions/userNotificationSettings'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      address:
        $ref: '#/definitions/userAddress'
      photo:
        type: string
      professionalSummary:
        type: string
      lastSeen:
        type: string
        format: date-time
  offerInCooperations:
    type: object
    properties:
      _id:
        type: string
      price:
        type: number
      title:
        type: string
      subject:
        $ref: '#/definitions/subjectWithName'
      category:
        $ref: '#/definitions/categoryWithAppearance'
  offerInCooperationExtended:
    type: object
    properties:
      _id:
        type: string
      proficiencyLevel:
        $ref: '#/definitions/offerProficiencyLevelValues'
      title:
        type: string
      description:
        type: string
      languages:
        $ref: '#/definitions/offerLanguagesValues'
      author:
        $ref: '#/definitions/offerAuthor'
      subject:
        $ref: '#/definitions/subjectWithName'
      category:
        $ref: '#/definitions/categoryWithNameAppearance'
  cooperationLesson:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      title:
        type: string
      description:
        type: string
      content:
        type: string
      attachments:
        type: array
        items:
          type: string
      category:
        type: string
        nullable: true
        default: null
      isDuplicate:
        type: boolean
  cooperationQuiz:
    type: object
    properties:
      _id:
        type: string
      title:
        type: string
      description:
        type: string
      items:
        type: array
        items:
          type: string
      author:
        type: string
      category:
        type: string
        nullable: true
        default: null
      isDuplicate:
        type: boolean
      settings:
        type: object
        properties:
          view:
            type: string
            enum:
              - Stepper
              - Scroll
          shuffle:
            type: boolean
          pointValues:
            type: boolean
          scoredResponses:
            type: boolean
          correctAnswers:
            type: boolean
