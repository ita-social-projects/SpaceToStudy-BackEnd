name: Push (chore/**)

on:
  push:
    branches: ['chore/**']

jobs:
  run-tests:
    name: Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: |
          set -o pipefail
          npm test --verbose --coverage=false 2>&1 | tee test-results.log
          exit_code=${PIPESTATUS[0]}

          echo "Tests finished with exit code: $exit_code"
          exit 0

      - name: Fail if tests failed
        run: |
          # Если тесты упали, job завершится с ошибкой
          if grep -q "FAIL" test-results.log; then
            echo "❌ Tests failed!"
            exit 1
          fi

      - name: Upload test logs
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.log
