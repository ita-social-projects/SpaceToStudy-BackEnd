version: 2
updates:
  # Production npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 5
    target-branch: "main"
    labels:
      - "dependencies"
      - "production"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
      include: "scope"
    versioning-strategy: auto
    groups:
      production-deps:
        patterns:
          # Core dependencies
          - "express*"
          - "mongoose*"
          - "mongodb*"
          # Security
          - "bcrypt*"
          - "jsonwebtoken*"
          # Storage
          - "@azure/storage-blob*"
          - "multer*"
          # Communication
          - "socket.io*"
          - "nodemailer*"
          # Logging
          - "winston*"
          - "winston-mongodb*"
          # API Documentation
          - "swagger*"
        exclude-patterns:
          # Type definitions
          - "@types/*"
          # Linting and formatting
          - "eslint*"
          - "prettier*"
          # Testing
          - "jest*"
          - "supertest*"
          # Development tools
          - "nodemon*"
          - "husky*"
          - "lint-staged*"

  # Development npm dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    labels:
      - "dependencies"
      - "dev-dependencies"
    commit-message:
      prefix: "chore(dev-deps)"
      include: "scope"
    open-pull-requests-limit: 5
    groups:
      dev-deps:
        patterns:
          - "@types/*"
          - "eslint*"
          - "prettier*"
          - "jest*"
          - "supertest*"
          - "nodemon*"
          - "husky*"
          - "lint-staged*"

  # Docker dependencies
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 3
    target-branch: "main"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(docker)"
      include: "scope"

  # GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/.github/workflows"
    schedule:
      interval: "monthly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Kyiv"
    open-pull-requests-limit: 3
    target-branch: "main"
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
      include: "scope"
