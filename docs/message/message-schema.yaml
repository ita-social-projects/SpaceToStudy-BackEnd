definitions:
  messages:
    type: object
    properties:
      items:
        type: array
        items:
          $ref: '#/definitions/message'
      count:
        type: integer
        description: Total number of messages
  messageBody:
    type: object
    properties:
      author:
        type: string
        $ref: '#/definitions/user'
      text:
        type: string
      chat:
        type: string
        $ref: '#/definitions/chat'
  message:
    type: object
    properties:
      _id:
        type: string
      author:
        type: object
        properties:
          _id:
            type: string
            $ref: '#/definitions/user'
          photo:
            type: string
      authorRole:
        type: string
        enum:
          - student
          - tutor
      text:
        type: string
      isRead:
        type: boolean
      isNotified:
        type: boolean
      chat:
        type: string
        $ref: '#/definitions/chat'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
