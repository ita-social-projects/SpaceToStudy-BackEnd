definitions:
  reviews:
    type: array
    items:
      type: object
      properties:
        _id:
          type: string
        comment:
          type: string
        rating:
          type: number
        author:
          type: object
          ref: '#/components/user'
        targetUserId:
          type: string
          ref: '#components/user'
        targetUserRole:
          type: string
        offer:
          type: object
          ref: '#components/offer'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
  reviewResponse:
    type: object
    properties:
      _id:
        type: string
      comment:
        type: string
      rating:
        type: number
      author:
        type: object
        properties:
          _id:
            type: string
          firstName:
            type: string
          lastName:
            type: string
          avatar:
            type: string
      targetUserId:
        type: string
        description: _id
      targetUserRole:
        type: string
      offer:
        type: object
        properties:
          _id:
            type: string
          subject:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
          category:
            type: object
            properties:
              _id:
                type: string
              name:
                type: string
      proficiencyLevel:
        type: string
        enum:
          - Beginner
          - Intermediate
          - Advanced
          - Test Preparation
          - Professional
          - Specialized
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  review:
    type: object
    properties:
      comment:
        type: string
      rating:
        type: number
      author:
        type: object
        ref: '#/components/user'
      targetUserId:
        type: string
        ref: '#components/user'
      targetUserRole:
        type: string
      offer:
        type: object
        ref: '#components/offer'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  update-review:
    type: object
    properties:
      comment:
        type: string
      rating:
        type: number
  reviewStats:
    type: object
    properties:
      stats:
        type: array
        items:
          type: object
          properties:
            rating:
              type: integer
            count:
              type: integer
