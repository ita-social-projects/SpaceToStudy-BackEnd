definitions:
  cooperations:
    type: array
    items:
      type: object
      properties:
        _id:
          type: string
        offer:
          $ref: '#/definitions/offerInCooperations'
        initiator:
          type: string
        initiatorRole:
          $ref: '#/definitions/baseUserRoleEnum'
        receiver:
          type: string
        receiverRole:
          $ref: '#/definitions/baseUserRoleEnum'
        title:
          type: string
          minLength: 1
          maxLength: 100
        additionalInfo:
          type: string
          minLength: 30
          maxLength: 1000
        proficiencyLevel:
          $ref: '#/definitions/offerProficiencyLevelEnum'
        price:
          type: number
        status:
          $ref: '#/definitions/cooperationStatusEnum'
        needAction:
          $ref: '#/definitions/baseUserRoleEnum'
        availableQuizzes:
          type: array
          items:
            type: string
        finishedQuizzes:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        user:
          $ref: '#/definitions/userInCooperations'
  cooperation:
    type: object
    properties:
      _id:
        type: string
      offer:
        $ref: '#/definitions/offerInCooperationExtended'
      initiator:
        $ref: '#/definitions/userInCooperationsExtended'
      initiatorRole:
        type: string
      receiver:
        $ref: '#/definitions/userInCooperationsExtended'
      receiverRole:
        type: string
      title:
        type: string
      additionalInfo:
        type: string
        minLength: 30
        maxLength: 1000
      proficiencyLevel:
        $ref: '#/definitions/offerProficiencyLevelEnum'
      price:
        type: number
      status:
        $ref: '#/definitions/cooperationStatusEnum'
      needAction:
        $ref: '#/definitions/baseUserRoleEnum'
      availableQuizzes:
        type: array
        items:
          type: string
      finishedQuizzes:
        type: array
        items:
          type: string
      sections:
        type: array
        items:
          $ref: '#/definitions/section'
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  cooperationBody:
    type: object
    properties:
      offer:
        type: string
        description: _id
        ref: '#/definitions/offer'
      receiver:
        type: string
        description: _id
        ref: '#/definitions/user'
      receiverRole:
        type: string
      price:
        type: number
      title:
        type: string
      additionalInfo:
        type: string
        minLength: 30
        maxLength: 1000
      proficiencyLevel:
        type: string
        enum:
          - Beginner
          - Intermediate
          - Advanced
          - Test Preparation
          - Professional
          - Specialized
      sections:
        type: array
        items:
          $ref: '#/definitions/section'
    required:
      - title
      - offer
      - receiver
      - proficiencyLevel
      - receiverRole
      - price
  section:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      resources:
        type: array
        items:
          type: object
          properties:
            resource:
              type: object
              oneOf:
                - $ref: '#/definitions/cooperationLesson'
                - $ref: '#/definitions/cooperationQuiz'
                - $ref: '#/definitions/cooperationAttachment'
                - $ref: '#/definitions/question'
            resourceType:
              $ref: '#/definitions/resourceType'
            availability:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - closed
                    - openFrom
                  default: open
                date:
                  type: string
                  format: date-time
                  default: null
            completionStatus:
              $ref: '#/definitions/completionStatus'
  completionStatus:
    type: string
    enum:
      - completed
      - active
  cooperationStatusEnum:
    type: string
    enum:
      - pending
      - active
      - declined
      - closed
      - request to close
  resourceType:
    type: string
    enum:
      - lesson
      - quiz
      - attachment
      - question
