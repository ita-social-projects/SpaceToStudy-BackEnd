definitions:
  updateLessonRequest:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 100
  lessonBody:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 100
      content:
        type: string
        minLength: 50
      description:
        type: string
        minLength: 1
        maxLength: 1000
      attachments:
        type: array
        $ref: '#/definitions/attachments'
      category:
        type: string
        $ref: '#/definitions/resourcesCategory'
    required:
      - title
      - description
  lesson:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      title:
        type: string
      description:
        type: string
      content:
        type: string
      attachments:
        type: array
        items:
          type: string
      category:
        $ref: '#/definitions/lessonCategory'
      resourceType:
        type: string
        enum: [lesson, quiz, attachment, question]
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  lessons:
    type: object
    properties:
      count:
        type: number
      items:
        type: array
        $ref: '#/definitions/lesson'
  lessonCategory:
    type: object
    properties:
      _id:
        type: string
      name:
        type: string
