definitions:
  chats:
    type: array
    items:
      type: object
      properties:
        _id:
          type: string
        members:
          type: array
          properties:
            user:
              $ref: '#/definitions/userAsMember'
            role:
              type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        deletedFor:
          type: array
          items:
            type: object
            properties:
              user:
                type: string
        latestMessage:
          type: object
          $ref: '#/definitions/message'
  chatBody:
    type: object
    properties:
      member:
        type: string
      memberRole:
        type: string
  chat:
    type: object
    properties:
      _id:
        type: string
      members:
        type: object
        properties:
          user:
            type: object
            $ref: '#/definitions/userAsMember'
          role:
            type: string
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
      deletedFor:
        type: array
        items:
          type: object
          properties:
            user:
              type: string
      latestMessage:
        type: object
        $ref: '#/definitions/message'
  userAsMember:
    type: object
    properties:
      _id:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      photo:
        type: string
      professionalSummary:
        type: string
    required:
      - _id
      - firstName
      - lastName
