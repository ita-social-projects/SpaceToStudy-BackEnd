definitions:
  cooperations:
    type: array
    items:
      type: object
      properties:
        _id:
          type: string
        offer:
          type: string
          ref: '#components/offer'
        initiator:
          type: object
          $ref: '#/definitions/cooperationUser'
        initiatorRole:
          type: string
        receiver:
          type: object
          $ref: '#/definitions/cooperationUser'
        receiverRole:
          type: string
        price:
          type: number
        title:
          type: string
        additionalInfo:
          type: string
          minLength: 30
          maxLength: 1000
        proficiencyLevel:
          type: string
          enum:
            - Beginner
            - Intermediate
            - Advanced
            - Test Preparation
            - Professional
            - Specialized
        status:
          type: string
          enum:
            - pending
            - active
            - declined
            - closed
        availableQuizzes:
          type: array
          items:
            type: string
            ref: '#components/quiz'
        finishedQuizzes:
          type: array
          items:
            type: string
            ref: '#components/finishedQuiz'
        needAction:
          type: string
          enum:
            - student
            - tutor
        user:
          type: object
          description: Details of the partner user involved in the cooperation
          properties:
            _id:
              type: string
            firstName:
              type: string
            lastName:
              type: string
            photo:
              type: string
            role:
              type: string
  cooperation:
    type: object
    properties:
      _id:
        type: string
      offer:
        type: string
        ref: '#components/offer'
      initiator:
        type: object
        $ref: '#/definitions/cooperationUser'
      initiatorRole:
        type: string
      receiver:
        type: object
        $ref: '#/definitions/cooperationUser'
      receiverRole:
        type: string
      price:
        type: number
      title:
        type: string
      additionalInfo:
        type: string
        minLength: 30
        maxLength: 1000
      proficiencyLevel:
        type: string
        enum:
          - Beginner
          - Intermediate
          - Advanced
          - Test Preparation
          - Professional
          - Specialized
      status:
        type: string
        enum:
          - pending
          - active
          - declined
          - closed
      availableQuizzes:
        type: array
        items:
          type: string
          ref: '#components/quiz'
      finishedQuizzes:
        type: array
        items:
          type: string
          ref: '#components/finishedQuiz'
      sections:
        type: array
        items:
          type: object
          $ref: '#/definitions/section'
      needAction:
        type: string
        enum:
          - student
          - tutor
      createdAt:
        type: string
        format: date-time
      updatedAt:
        type: string
        format: date-time
  cooperationBody:
    type: object
    properties:
      offer:
        type: string
        ref: '#components/offer'
      receiver:
        type: object
        $ref: '#/definitions/cooperationUser'
      receiverRole:
        type: string
      price:
        type: number
      title:
        type: string
      additionalInfo:
        type: string
        minLength: 30
        maxLength: 1000
      proficiencyLevel:
        type: string
        enum:
          - Beginner
          - Intermediate
          - Advanced
          - Test Preparation
          - Professional
          - Specialized
      sections:
        type: array
        items:
          type: object
          $ref: '#/definitions/section'
    required:
      - title
      - offer
      - receiver
      - proficiencyLevel
      - receiverRole
      - price
  section:
    type: object
    properties:
      title:
        type: string
      description:
        type: string
      resources:
        type: array
        items:
          type: object
          properties:
            resource:
              type: object
              additionalProperties: true
            resourceType:
              type: string
              enum:
                - lesson
                - quiz
                - attachment
            availability:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    - open
                    - closed
                    - openFrom
                  default: open
                date:
                  type: string
                  format: date-time
                  default: null
            completionStatus:
              type: string
              enum:
                - active
                - completed
  cooperationUser:
    type: object
    properties:
      address:
        type: object
        properties:
          country:
            type: string
          city:
            type: string
      mainSubjects:
        type: object
        properties:
          student:
            type: array
            items:
              type: string
          tutor:
            type: array
            items:
              type: object
              properties:
                category:
                  type: string
                subjects:
                  type: array
                  items:
                    type: string
                _id:
                  type: string
      totalReviews:
        type: object
        properties:
          student:
            type: integer
          tutor:
            type: integer
      averageRating:
        type: object
        properties:
          student:
            type: number
          tutor:
            type: number
      status:
        type: object
        properties:
          student:
            type: string
          tutor:
            type: string
          admin:
            type: string
      videoLink:
        type: object
        properties:
          tutor:
            type: string
      professionalBlock:
        type: object
        properties:
          awards:
            type: string
          scientificActivities:
            type: string
          workExperience:
            type: string
          education:
            type: string
      notificationSettings:
        type: object
        properties:
          isOfferStatusNotification:
            type: boolean
          isChatNotification:
            type: boolean
          isSimilarOffersNotification:
            type: boolean
          isEmailNotification:
            type: boolean
