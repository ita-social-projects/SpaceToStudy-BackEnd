paths:
  /quizzes/attempts:
    get:
      security:
        - cookieAuth: []
      tags:
        - Attempts
      summary: Find all attempts.
      description: Finds and returns an array with a list of all user attempts.
      produces:
        - application/json
      parameters:
        - in: query
          name: skip
          schema:
            type: string
          required: false
        - in: query
          name: limit
          schema:
            type: string
          required: false
      responses:
        200:
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/definitions/attempts'
              example:
                items:
                  - _id: 64ca5914b57f2442403394a5
                    quiz: 64cf82cb290732a7973f1e09
                    grade: 100
                    results:
                      - question: Is it the best programming language?
                        answers:
                          - text: Yes
                            isCorrect: false
                            isChosen: true
                          - text: Yes, of course
                            isCorrect: true
                            isChosen: false
                    createdAt: 2023-08-06T11:30:06.747Z
                    updatedAt: 2023-08-06T11:30:06.747Z
                  - _id: 64ca5932b57f2442403394a9
                    quiz: 64cf82cb290732a7973f1e06
                    grade: 100
                    results:
                      - question: How are you going?
                        answers:
                          - text: Fine,
                            isCorrect: false
                            isChosen: false
                          - text: Bad,
                            isCorrect: true
                            isChosen: true
                    createdAt: 2023-08-06T11:30:06.747Z
                    updatedAt: 2023-08-06T11:30:06.747Z
                count: 2
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
    post:
      security:
        - cookieAuth: []
      tags:
        - Attempts
      summary: Creates a new attempt.
      description: Creates a new attempt with results of the user and saves it to database.
      produces:
        - application/json
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/definitions/attemptBody'
            example:
              quiz: 64cf82cb290732a7973f1e09
              grade: 30
              results:
                - question: How are you going?
                  answers:
                    - text: I'm fine
                      isCorrect: true
                      isChosen: false
                    - text: Bad
                      isCorrect: false
                      isChosen: true
      responses:
        201:
          description: Created
          content:
            application/json:
              schema:
                $ref: '#definitions/attempt'
              example:
                quiz: 64cf82cb290732a7973f1e09
                grade: 30
                results:
                  - question: How are you going?
                    answers:
                      - text: I'm fine
                        isCorrect: true
                        isChosen: false
                      - text: Bad
                        isCorrect: false
                        isChosen: true
                _id: 64cf843e75e3952d346caa94
                createdAt: 2023-08-06T11:30:06.747Z
                updatedAt: 2023-08-06T11:30:06.747Z
        401:
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/Error'
              example:
                status: 401
                code: UNAUTHORIZED
                message: The requested URL requires user authorization.
        403:
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: '#/components/Error'
              example:
                status: 403
                code: FORBIDDEN
                message: You do not have permission to perform this action.
        404:
          description: Not Found Notification
          content:
            application/json:
              schema:
                $ref: '#/components/Error'
              example:
                status: 404
                code: DOCUMENT_NOT_FOUND
                message: Quiz with the specified id was not found.
