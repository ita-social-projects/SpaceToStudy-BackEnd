definitions:
  updateLessonRequest:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 100
  lessonBody:
    type: object
    properties:
      title:
        type: string
        minLength: 1
        maxLength: 100
      content:
        type: string
        minLength: 50
      description:
        type: string
        minLength: 1
        maxLength: 1000
      attachments:
        type: array
        $ref: '#/definitions/attachments'
      category:
        type: string
        $ref: '#/definitions/resourcesCategory'
    required:
      - title
      - description
  lesson:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
        $ref: '#components/user'
      title:
        type: string
      description:
        type: string
      content:
        type: string
      attachments:
        type: array
        $ref: '#/definitions/attachments'
      category:
        type: string
        $ref: '#/definitions/resourcesCategory'
  cooperationLesson:
    type: object
    properties:
      _id:
        type: string
      author:
        type: string
      title:
        type: string
      description:
        type: string
        minLength: 1
        maxLength: 1000
      content:
        type: string
        minLength: 50
      attachments:
        type: array
        items:
          type: string
      category:
        type: string
        default: null
      resourceType:
        $ref: '#/definitions/resourceType'
      isDuplicate:
        type: boolean
