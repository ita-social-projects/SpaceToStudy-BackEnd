name: CI feature/** branch

on:
  push:
    branches:
      - 'feature/**'
  workflow_dispatch:

jobs:
  check-branch-name:
    runs-on: ubuntu-latest
    steps:
      - name: Validate branch name
        run: |
          BRANCH_NAME="${GITHUB_REF#refs/heads/}"
          if [[ ! "$BRANCH_NAME" =~ ^feature/[0-9]+/.+ ]]; then
            echo "❌ Branch name is incorrect! Expected format: feature/issue_number/problem_name"
            exit 1
          fi
          echo "✅ Branch name is valid"

  test:
    needs: check-branch-name
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22.x]
        mongodb-version: ['8.0']
      max-parallel: 1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install MongoDB ${{ matrix.mongodb-version }}
        uses: supercharge/mongodb-github-action@1.12.0
        with:
          mongodb-version: ${{ matrix.mongodb-version }}
          mongodb-db: ${{ secrets.MONGODB_DB }}
          mongodb-username: ${{ secrets.MONGODB_USER }}
          mongodb-password: ${{ secrets.MONGODB_PASS }}
          mongodb-port: 27017

      - name: Install dependencies
        run: npm install

      - name: Run Linter
        run: npm run lint

      - name: Run Tests
        run: |
          npm test -- src/test/unit/services --verbose --coverage=false 2>&1 | tee full-test-results.txt

      - name: Extract Summary from Test Results
        run: |
          grep -E "Test Suites:|Tests:|Snapshots:|Time:|Ran all test suites." full-test-results.txt > test-summary.txt || true
          if [ ! -s test-summary.txt ]; then
            echo "⚠ No test results found!" > test-summary.txt
          fi

      - name: Upload Test Summary
        uses: actions/upload-artifact@v4
        with:
          name: test-summary
          path: test-summary.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v4.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  create-pull-request:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Test Summary
        uses: actions/download-artifact@v4
        with:
          name: test-summary
          path: ./

      - name: Format Test Summary for PR
        run: |
          echo "## Test Summary" > pr_body.txt
          echo '```' >> pr_body.txt
          cat test-summary.txt >> pr_body.txt
          echo '```' >> pr_body.txt
          echo "" >> pr_body.txt
          echo "Closes #${{ github.event.issue.number }}" >> pr_body.txt

      - name: Create Pull Request
        id: create_pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: develop
          branch: ${{ github.ref_name }}
          title: "${{ github.ref_name }}"
          body-path: pr_body.txt
          labels: "DevOps"
          assignees: ${{ github.actor }}

